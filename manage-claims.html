<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Manage Claims | CampusCare</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <nav class="navbar bg-white border-bottom">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">
                CampusCare
            </a>

            <button id="logoutButton" class="btn btn-outline-primary">
                Logout
            </button>
        </div>
    </nav>

    <main class="container py-5">

        <section class="mb-4">
            <p class="section-label">CLAIM MANAGEMENT</p>
            <h2>Manage Claims</h2>
            <p>Review student claims and verify ownership of recovered items.</p>
            <p class="small text-muted" id="staffEmail"></p>
        </section>

        <section class="mb-4">
            <label for="claimStatusFilter" class="form-label">
                Filter by Status
            </label>

            <select id="claimStatusFilter" class="form-select">
                <option value="all">All Claims</option>
                <option value="pending">Pending</option>
                <option value="approved">Approved</option>
                <option value="rejected">Rejected</option>
            </select>
        </section>

        <p id="claimsMessage" class="text-muted">
            Loading claims...
        </p>

        <section id="manageClaimsContainer" class="row g-3"></section>

    </main>

    <script src="firebase-config.js"></script>
    <script type="module" src="script.js"></script>

</body>

</html>
