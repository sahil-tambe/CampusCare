<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Recovery Records | CampusCare</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <nav class="navbar bg-white border-bottom">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">
                CampusCare
            </a>

            <button id="logoutButton" class="btn btn-outline-primary">
                Logout
            </button>
        </div>
    </nav>

    <main class="container py-5">

        <section class="mb-4">
            <p class="section-label">RECOVERY MANAGEMENT</p>

            <h2>Recovery Records</h2>

            <p>View items that have been successfully recovered on campus.</p>

            <p class="small text-muted" id="recoveryStaffEmail"></p>
        </section>

        <section class="mb-4">
            <label for="recoveryTypeFilter" class="form-label">
                Filter by Item Type
            </label>

            <select id="recoveryTypeFilter" class="form-select">
                <option value="all">All Items</option>
                <option value="lost">Lost Items</option>
                <option value="found">Found Items</option>
            </select>
        </section>

        <p id="recoveryMessage" class="text-muted">
            Loading recovery records...
        </p>

        <section id="recoveryRecordsContainer" class="row g-3"></section>

    </main>

    <script src="firebase-config.js"></script>
    <script type="module" src="script.js"></script>

</body>

</html>
