<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Report an Item | CampusCare</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <nav class="navbar bg-white border-bottom">
        <div class="container">
            <a class="navbar-brand fw-bold" href="dashboard.html">
                CampusCare
            </a>
            <a href="dashboard.html" class="btn btn-outline-primary">
                Dashboard
            </a>
        </div>
    </nav>

    <main class="container py-5">
        <div class="auth-card mx-auto">

            <h2>Report an Item</h2>
            <p>Provide the details of the lost or found item.</p>

            <form id="reportForm">

                <div class="mb-3">
                    <label for="itemType" class="form-label">
                        What would you like to report?
                    </label>
                    <select id="itemType" class="form-select" required>
                        <option value="">Select report type</option>
                        <option value="lost">I Lost Something</option>
                        <option value="found">I Found Something</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label for="itemTitle" class="form-label">
                        Item Name
                    </label>
                    <input type="text" id="itemTitle" class="form-control" placeholder="Example: Black Wallet"
                        maxlength="100" required>
                </div>

                <div class="mb-3">
                    <label for="itemCategory" class="form-label">
                        Category
                    </label>
                    <select id="itemCategory" class="form-select" required>
                        <option value="">Select category</option>
                        <option value="Electronics">Electronics</option>
                        <option value="Accessories">Accessories</option>
                        <option value="Documents">Documents</option>
                        <option value="Books">Books</option>
                        <option value="Clothing">Clothing</option>
                        <option value="Stationery">Stationery</option>
                        <option value="Other">Other</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label for="itemDescription" class="form-label">
                        Description
                    </label>
                    <textarea id="itemDescription" class="form-control" rows="3" placeholder="Describe the item..."
                        maxlength="1000" required></textarea>
                </div>

                <div class="mb-3">
                    <label for="itemLocation" class="form-label">
                        Location on Campus
                    </label>
                    <input type="text" id="itemLocation" class="form-control" placeholder="Example: College Library"
                        maxlength="150" required>
                </div>

                <div class="mb-3">
                    <label for="itemDate" class="form-label">
                        Date Lost / Found
                    </label>
                    <input type="date" id="itemDate" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label for="itemImage" class="form-label">
                        Upload Item Photo (Optional)
                    </label>

                    <input type="file" id="itemImage" class="form-control" accept="image/jpeg, image/png, image/webp">

                    <small class="text-muted">
                        Supported formats: JPG, PNG and WebP.
                    </small>

                    <div class="mt-3">
                        <img id="imagePreview" src="" alt="Selected item preview" class="img-fluid rounded"
                            style="max-width: 250px; display: none;">
                    </div>
                </div>

                <button type="submit" class="btn btn-primary w-100">
                    Submit Report
                </button>

                <p id="reportMessage" class="small mt-3"></p>

            </form>
        </div>
    </main>

    <script src="firebase-config.js"></script>
    <script type="module" src="script.js"></script>

</body>

</html>
