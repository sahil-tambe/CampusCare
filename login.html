<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | CampusCare</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <nav class="navbar bg-white border-bottom">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">CampusCare</a>
            <a href="signup.html" class="btn btn-outline-primary">Sign Up</a>
        </div>
    </nav>

    <main class="auth-container">
        <div class="auth-card">

            <h2>Welcome back!</h2>
            <p>Login to your CampusCare account.</p>

            <form id="loginForm">

                <div class="mb-3">
                    <label for="loginEmail" class="form-label">College Email</label>
                    <input type="email" id="loginEmail" class="form-control" placeholder="name@somaiya.edu" required>
                </div>

                <div class="mb-3">
                    <label for="loginPassword" class="form-label">Password</label>
                    <input type="password" id="loginPassword" class="form-control" placeholder="Enter your password"
                        required>
                </div>

                <button type="submit" class="btn btn-primary w-100">
                    Login
                </button>

                <p id="loginMessage" class="mt-3 small"></p>

            </form>

            <p class="mt-3 text-center">
                Don't have an account?
                <a href="signup.html">Create Account</a>
            </p>

        </div>
    </main>

    <script src="firebase-config.js"></script>
    <script type="module" src="script.js"></script>
</body>

</html>
