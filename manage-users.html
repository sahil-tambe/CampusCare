<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Students | CampusCare</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <nav class="navbar navbar-expand-lg">
        <div class="container">
            <a class="navbar-brand" href="admin-dashboard.html">CampusCare</a>

            <div class="d-flex align-items-center gap-3">
                <a href="admin-dashboard.html" class="btn btn-outline-secondary btn-sm">
                    Dashboard
                </a>
                <button id="logoutButton" class="btn btn-outline-danger btn-sm">
                    Logout
                </button>
            </div>
        </div>
    </nav>

    <main class="container py-5">

        <div class="mb-4">
            <h2>Manage Student Accounts</h2>
            <p class="text-muted">
                View registered users and their account roles.
            </p>
        </div>


        <div class="card p-3 mb-4">
            <div class="row g-3">

                <div class="col-md-6">
                    <label for="userSearch" class="form-label">
                        Search users
                    </label>
                    <input type="text" id="userSearch" class="form-control" placeholder="Search by name or email...">
                </div>

                <div class="col-md-6">
                    <label for="roleFilter" class="form-label">
                        Filter by role
                    </label>
                    <select id="roleFilter" class="form-select">
                        <option value="all">All Accounts</option>
                        <option value="student">Students</option>
                        <option value="recovery_officer">Recovery Officers</option>
                        <option value="admin">Admins</option>
                    </select>
                </div>

            </div>
        </div>


        <p id="usersMessage" class="text-muted">
            Loading user accounts...
        </p>

        <div class="table-responsive">
            <table class="table table-hover align-middle">
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Role</th>
                        <th>Registered On</th>
                    </tr>
                </thead>

                <tbody id="usersContainer"></tbody>
            </table>
        </div>

    </main>

    <script src="firebase-config.js"></script>
    <script type="module" src="script.js"></script>
</body>

</html>
