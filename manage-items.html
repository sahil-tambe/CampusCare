<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Manage Items | CampusCare</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <nav class="navbar bg-white border-bottom">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">
                CampusCare
            </a>

            <button id="logoutButton" class="btn btn-outline-primary">
                Logout
            </button>
        </div>
    </nav>

    <main class="container py-5">

        <section class="mb-4">
            <p class="section-label">ITEM MANAGEMENT</p>

            <h2>Manage Lost & Found Items</h2>

            <p>Review and manage all reported items across the campus.</p>

            <p class="small text-muted" id="staffEmail"></p>
        </section>

        <section class="row g-3 mb-4">

            <div class="col-md-4">
                <label for="itemTypeFilter" class="form-label">
                    Filter by Type
                </label>

                <select id="itemTypeFilter" class="form-select">
                    <option value="all">All Items</option>
                    <option value="lost">Lost Items</option>
                    <option value="found">Found Items</option>
                </select>
            </div>

            <div class="col-md-4">
                <label for="itemStatusFilter" class="form-label">
                    Filter by Status
                </label>

                <select id="itemStatusFilter" class="form-select">
                    <option value="all">All Statuses</option>
                    <option value="open">Open</option>
                    <option value="recovered">Recovered</option>
                    <option value="closed">Closed</option>
                </select>
            </div>

        </section>

        <p id="manageItemsMessage" class="text-muted">
            Loading items...
        </p>

        <section id="manageItemsContainer" class="row g-3"></section>

    </main>

    <script src="firebase-config.js"></script>
    <script type="module" src="script.js"></script>

</body>

</html>
