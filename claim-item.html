<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Submit Claim | CampusCare</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <nav class="navbar bg-white border-bottom">
        <div class="container">
            <a class="navbar-brand fw-bold" href="dashboard.html">
                CampusCare
            </a>
            <a href="browse-items.html" class="btn btn-outline-primary">
                Browse Items
            </a>
        </div>
    </nav>

    <main class="container py-5">
        <div class="auth-card mx-auto">

            <h2>Claim an Item</h2>
            <p>Provide information to help verify your ownership.</p>

            <div id="claimItemDetails" class="mb-4">
                Loading item details...
            </div>

            <form id="claimForm">

                <div class="mb-3">
                    <label for="claimReason" class="form-label">
                        Why do you believe this item belongs to you?
                    </label>

                    <textarea id="claimReason" class="form-control" rows="4" maxlength="1000"
                        placeholder="Describe identifying details that can help verify ownership..."
                        required></textarea>
                </div>

                <div class="mb-3">
                    <label for="ownershipEvidence" class="form-label">
                        Additional ownership information
                    </label>

                    <textarea id="ownershipEvidence" class="form-control" rows="3" maxlength="1000"
                        placeholder="Provide any additional information for verification..."></textarea>
                </div>

                <p class="small text-muted">
                    Your claim information will be private and used
                    only for the ownership verification process.
                </p>

                <button type="submit" class="btn btn-primary w-100">
                    Submit Claim
                </button>

                <p id="claimMessage" class="small mt-3"></p>

            </form>

        </div>
    </main>

    <script src="firebase-config.js"></script>
    <script type="module" src="script.js"></script>

</body>

</html>
