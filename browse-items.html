<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Browse Items | CampusCare</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <nav class="navbar bg-white border-bottom">
        <div class="container">
            <a class="navbar-brand fw-bold" href="dashboard.html">
                CampusCare
            </a>
            <a href="dashboard.html" class="btn btn-outline-primary">
                Dashboard
            </a>
        </div>
    </nav>

    <main class="container py-5">

        <div class="mb-4">
            <p class="section-label">CAMPUS COMMUNITY</p>
            <h2>Lost & Found Items</h2>
            <p>Browse reports submitted by students on campus.</p>
        </div>

        <!-- Filters -->
        <div class="row g-3 mb-4">

            <div class="col-md-6">
                <label for="typeFilter" class="form-label">Report Type</label>
                <select id="typeFilter" class="form-select">
                    <option value="all">All Items</option>
                    <option value="lost">Lost Items</option>
                    <option value="found">Found Items</option>
                </select>
            </div>

            <div class="col-md-6">
                <label for="categoryFilter" class="form-label">Category</label>
                <select id="categoryFilter" class="form-select">
                    <option value="all">All Categories</option>
                    <option value="Electronics">Electronics</option>
                    <option value="Accessories">Accessories</option>
                    <option value="Documents">Documents</option>
                    <option value="Books">Books</option>
                    <option value="Clothing">Clothing</option>
                    <option value="Stationery">Stationery</option>
                    <option value="Other">Other</option>
                </select>
            </div>

        </div>

        <p id="itemsMessage" class="text-muted"></p>

        <!-- Items -->
        <div class="row g-3" id="itemsContainer"></div>

    </main>

    <script src="firebase-config.js"></script>
    <script type="module" src="script.js"></script>

</body>

</html>
