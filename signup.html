<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign Up | CampusCare</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <nav class="navbar bg-white border-bottom">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">CampusCare</a>
            <a href="login.html" class="btn btn-outline-primary">Login</a>
        </div>
    </nav>

    <main class="auth-container">
        <div class="auth-card">

            <h2>Create your account</h2>
            <p>Join your campus lost-and-found community.</p>

            <form id="signupForm">

                <div class="mb-3">
                    <label for="fullName" class="form-label">Full Name</label>
                    <input type="text" id="fullName" class="form-control" placeholder="Enter your full name" required>
                </div>

                <div class="mb-3">
                    <label for="signupEmail" class="form-label">College Email</label>
                    <input type="email" id="signupEmail" class="form-control" placeholder="name@somaiya.edu" required>
                </div>

                <div class="mb-3">
                    <label for="signupPassword" class="form-label">Password</label>
                    <input type="password" id="signupPassword" class="form-control" placeholder="Create a password"
                        minlength="8" required>
                </div>

                <div class="mb-3">
                    <label for="confirmPassword" class="form-label">
                        Confirm Password
                    </label>
                    <input type="password" id="confirmPassword" class="form-control" placeholder="Confirm your password"
                        required>
                </div>

                <button type="submit" class="btn btn-primary w-100">
                    Create Account
                </button>

                <p id="signupMessage" class="mt-3 small"></p>

            </form>

            <p class="mt-3 text-center">
                Already have an account?
                <a href="login.html">Login</a>
            </p>

        </div>
    </main>

    <script src="firebase-config.js"></script>
    <script type="module" src="script.js"></script>
</body>

</html>
